server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
  redis:
    host: 192.168.139.10
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  rabbitmq:
    host: 192.168.139.10
    port: 5672
    username: itcast
    password: 123321
    virtual-host: /
    # 消息到达交换机后执行Confirm回调
    publisher-confirm-type: correlated
    #消息无法路由到队列时返回给生产者
    publisher-returns: true
    template:
      #强制无法路由的消息返回给生产者
      mandatory: true

  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug